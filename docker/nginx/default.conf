server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    # Public files with stable URLs must revalidate across releases.
    add_header Cache-Control "no-cache" always;

    location = /sw.js {
        alias /var/www/html/public/build/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    # Compatibility for old installed clients while their worker/build updates.
    location = /assets/img/ai_profile.jpg {
        rewrite ^ /assets/icons/profile/cs.png last;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(app|apps)(/|$) {
        set $reverb reverb:8080;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /index.php {
        include fastcgi_params;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # Uploaded code is never executable or downloadable as source.
    location ~* \.(php[0-9]?|phtml|phar)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(artisan|composer\.(json|lock)|package(-lock)?\.json|storage/(app|framework|logs))(/|$) { return 404; }

    location /build/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}
