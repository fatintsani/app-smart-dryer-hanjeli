name: hanjeli-dryer

x-build-args: &frontend-args
  APP_BUILD_REVISION: ${IMAGE_TAG:-local}
  VITE_APP_NAME: ${VITE_APP_NAME:-Smart_Dryer_Hanjeli}
  VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:?Set VITE_REVERB_APP_KEY in existing .env}
  VITE_REVERB_HOST: ${VITE_REVERB_HOST:-hanjeli-dryer.stas-rg.com}
  VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
  VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
  VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
  VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}

x-app: &app
  image: ${APP_IMAGE:-hanjeli-app}:${IMAGE_TAG:-local}
  restart: unless-stopped
  init: true
  env_file:
    - ${APP_ENV_FILE:-.env}
  environment:
    TZ: Asia/Jakarta
    DB_HOST: ${DB_HOST:?Set DB_HOST=db}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE=dryer}
    DB_USERNAME: ${DB_USERNAME:?Set dedicated DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD}
  volumes:
    - laravel_storage:/var/www/html/storage
  networks:
    - backend
    - egress
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 90s
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate strong MYSQL_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mysql84_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  # One migration runner, never in each service's entrypoint.
  migrate:
    <<: *app
    restart: "no"
    command: [php, artisan, migrate, --force, --no-interaction]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    build:
      context: .
      target: runtime
      args: *frontend-args
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, fpm]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-hanjeli-web}:${IMAGE_TAG:-local}
    build:
      context: .
      target: web
      args: *frontend-args
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    networks:
      - egress
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/up]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

  queue:
    <<: *app
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=60]
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, "queue:work"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mqtt:
    <<: *app
    command: [php, artisan, "greenhouse:mqtt-worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      reverb:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, mqtt]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  reverb:
    <<: *app
    command: [php, artisan, "reverb:start", --host=0.0.0.0, --port=8080]
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, reverb]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *app
    command: [php, artisan, "schedule:work"]
    healthcheck:
      test: [CMD, php, docker/healthcheck.php, "schedule:work"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend:
    internal: true
  # Private to this Compose project; outbound access for MQTT/OAuth/mail/APIs.
  egress:
    driver: bridge

volumes:
  mysql84_data:
  laravel_storage:
