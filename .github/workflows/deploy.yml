name: Laravel CI & Docker Validation + Manual VPS CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy the tested main commit to production VPS?'
        type: boolean
        required: true
        default: false

concurrency:
  group: hanjeli-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Test & Build Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, curl, zip, pcntl, fileinfo, tokenizer
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache NPM Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Prepare CI Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Test frontend connection and Service Worker policies
        run: npm run test:frontend

      - name: Test post-deployment frontend verification
        run: python3 -m unittest discover -s tests/deployment -p 'test_*.py' -v

      - name: Build Frontend Assets
        run: npm run build

      - name: Check Vite Manifest
        run: test -f public/build/manifest.json

      - name: Run Laravel Tests
        run: php artisan test

  docker:
    name: Build & Smoke Test Docker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate isolated stack, migrations, workers and persistence
        run: bash docker/validate.sh

  deploy:
    name: Deploy Tested Commit to Production VPS (Automatic)
    needs: [ci, docker]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required reviewers are managed in repository Settings > Environments.
    environment:
      name: production
      url: https://hanjeli-dryer.stas-rg.com
    concurrency:
      group: hanjeli-production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy tested SHA over verified SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for required in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PORT VPS_DEPLOY_PATH VPS_KNOWN_HOSTS; do
            if [[ -z ${!required} ]]; then
              echo "Missing required secret: $required" >&2
              exit 1
            fi
          done
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || { echo 'Invalid VPS_HOST' >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ ]] || { echo 'Invalid VPS_USER' >&2; exit 1; }
          if [[ ! "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$VPS_PORT < 1 || 10#$VPS_PORT > 65535 )); then
            echo 'Invalid VPS_PORT' >&2
            exit 1
          fi
          [[ "$VPS_DEPLOY_PATH" == /* && "$VPS_DEPLOY_PATH" != *$'\n'* && "$VPS_DEPLOY_PATH" != *$'\r'* ]] || { echo 'VPS_DEPLOY_PATH must be an absolute path without line breaks' >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid tested commit SHA' >&2; exit 1; }

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/hanjeli-vps-ssh.XXXXXX")
          cleanup() {
            rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"
            rmdir "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null
          known_host="$VPS_HOST"
          if (( 10#$VPS_PORT != 22 )); then
            known_host="[$VPS_HOST]:$VPS_PORT"
          fi
          if ! ssh-keygen -F "$known_host" -f "$ssh_dir/known_hosts" > /dev/null; then
            echo 'VPS_KNOWN_HOSTS has no verified entry for VPS_HOST/VPS_PORT' >&2
            exit 1
          fi

          ssh_options=(
            -i "$ssh_dir/key" -p "$VPS_PORT"
            -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3
          )
          # Base64 transports the path as data, including spaces/quotes, without eval.
          path_base64=$(printf '%s' "$VPS_DEPLOY_PATH" | base64 -w0)
          # Expand only the encoded path and validated SHA on the runner, as remote arguments.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "bash -se -- '$path_base64' '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path=$(printf '%s' "$1" | base64 --decode)
          tested_sha=$2
          [[ "$tested_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid remote commit SHA' >&2; exit 1; }
          [[ "$deploy_path" == /* && -d "$deploy_path" ]] || { echo 'Deployment directory is missing or invalid' >&2; exit 1; }
          cd -- "$deploy_path"
          [[ "$(git rev-parse --show-toplevel)" == "$(pwd -P)" ]] || { echo 'Deployment path must be the Git repository root' >&2; exit 1; }
          [[ -f .env ]] || { echo 'Existing production .env is required; it will not be created' >&2; exit 1; }
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'Production .env must be untracked; refusing a checkout that could overwrite it' >&2
            exit 1
          fi
          checkout_status=$(git status --porcelain --untracked-files=normal)
          [[ -z "$checkout_status" ]] || { echo 'Deployment checkout has local changes; refusing to overwrite them' >&2; exit 1; }
          env_checksum=$(sha256sum .env | cut -d ' ' -f 1)

          # Fetch exactly the SHA tested by this workflow; never deploy a newer main.
          git fetch --no-tags origin "$tested_sha"
          [[ "$(git rev-parse FETCH_HEAD)" == "$tested_sha" ]] || { echo 'Fetched SHA differs from tested SHA' >&2; exit 1; }
          if git cat-file -e "$tested_sha:.env" 2>/dev/null; then
            echo 'Tested commit unexpectedly tracks .env; deployment refused' >&2
            exit 1
          fi
          git checkout --detach "$tested_sha"
          [[ "$(git rev-parse HEAD)" == "$tested_sha" ]] || { echo 'Checkout SHA differs from tested SHA' >&2; exit 1; }
          [[ -f .env && "$(sha256sum .env | cut -d ' ' -f 1)" == "$env_checksum" ]] || { echo 'Production .env changed unexpectedly' >&2; exit 1; }

          export IMAGE_TAG="$tested_sha"
          export APP_ENV_FILE="$PWD/.env"
          bash docker/deploy.sh "$tested_sha"
          docker compose --env-file .env ps -a
          docker compose --env-file .env exec -T app php docker/smoke.php
          # Fail even when /up is healthy if the public host still serves legacy assets.
          python3 scripts/verify_frontend.py --expected-revision "$tested_sha" --wss
          REMOTE

      - name: Verify public HTTPS health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          status=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            --output /dev/null --write-out '%{http_code}' \
            https://hanjeli-dryer.stas-rg.com/up)
          [[ "$status" == 200 ]] || { echo "HTTPS /up returned HTTP $status" >&2; exit 1; }
          echo 'PASS: public HTTPS /up returned HTTP 200'
