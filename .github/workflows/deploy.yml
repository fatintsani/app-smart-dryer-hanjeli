name: CI/CD Pipeline & VPS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy ke VPS Production (Non-Docker)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. TEST & BUILD VALIDATION (Continuous Integration)
  # =========================================================================
  ci:
    name: Test & Build Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, curl, zip, pcntl, fileinfo, tokenizer
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Cache NPM Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 🔑 Prepare Environment & Database
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: 📥 Install Composer Dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress

      - name: 🔑 Generate Application Key
        run: |
          php artisan key:generate --force

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      # Build harus sebelum test karena test GET / memerlukan Vite manifest.
      - name: Build Frontend Assets
        run: npm run build

      - name: Check Vite Manifest
        run: test -f public/build/manifest.json

      - name: Run Laravel Tests
        run: php artisan test

  # CD legacy: hanya aktif bila dipilih manual.
  # Jangan gunakan job ini untuk container Docker.
  deploy:
    name: Deploy to Production VPS (Non-Docker)
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate SSH Configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$SSH_HOST" || { echo 'SSH_HOST belum diatur'; exit 1; }
          test -n "$SSH_USER" || { echo 'SSH_USER belum diatur'; exit 1; }
          test -n "$SSH_KEY" || { echo 'SSH_KEY belum diatur'; exit 1; }
          test -n "$DEPLOY_PATH" || { echo 'DEPLOY_PATH belum diatur'; exit 1; }

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e

            if [ -z "${DEPLOY_PATH:-}" ] || [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo 'DEPLOY_PATH tidak valid atau bukan direktori Git.'
              exit 1
            fi

            cd "$DEPLOY_PATH"
            if [ ! -f .env ]; then
              echo 'File .env production tidak ditemukan.'
              exit 1
            fi

            BACKUP_ROOT="${DEPLOY_PATH}/../backups_hanjeli"
            BACKUP_DIR="${BACKUP_ROOT}/backup_$(date +%Y%m%d_%H%M%S)"
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            mkdir -p "$BACKUP_DIR"
            cp .env "$BACKUP_DIR/.env"

            # Backup database diupayakan setelah aplikasi masuk maintenance.
            php artisan down --retry=60

            rollback() {
              exit_code=$?
              trap - EXIT
              if [ "$exit_code" -ne 0 ]; then
                echo 'Deployment gagal. Memulihkan versi sebelumnya...'
                git reset --hard "$PREVIOUS_COMMIT" || true
                cp "$BACKUP_DIR/.env" .env || true
                if [ -f "$BACKUP_DIR/database.sqlite" ]; then
                  cp "$BACKUP_DIR/database.sqlite" database/database.sqlite || true
                fi
                php artisan optimize:clear || true
                php artisan up || true
                php artisan queue:restart || true
              fi
              exit "$exit_code"
            }
            trap rollback EXIT

            if [ -f database/database.sqlite ]; then
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 database/database.sqlite ".backup '${BACKUP_DIR}/database.sqlite'"
              else
                echo 'Peringatan: sqlite3 CLI tidak ditemukan; menyalin database sebagai fallback.'
                cp database/database.sqlite "$BACKUP_DIR/database.sqlite"
              fi
            fi

            git fetch origin main
            git reset --hard origin/main

            # PHP 8.3 dan Node.js 22 harus tersedia pada VPS non-Docker.
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            npm ci
            npm run build

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            php artisan storage:link || true
            php artisan queue:restart || true

            # Restart hanya service Smart Dryer bila Supervisor tersedia.
            if command -v supervisorctl >/dev/null 2>&1; then
              sudo supervisorctl restart 'hanjeli-worker:*' hanjeli-reverb hanjeli-mqtt || true
            fi

            php artisan up
            trap - EXIT
            echo "Deployment VPS berhasil: $(git rev-parse --short HEAD)"
